[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vica"
version = "0.1.0"
description = "Verifiable Intelligence Compute Arena"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  {name = "VICA Contributors"}
]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

solver = [
  "z3-solver>=4.13,<5",
]

server = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
vica = "vica.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vica"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "z3"
ignore_missing_imports = true
